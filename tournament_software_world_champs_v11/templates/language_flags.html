{% if not language_tournament or (is_admin and not public_view) %}
<nav class="language-bar" aria-label="{{ _('Language') }}">
<form method="post" action="{{ url_for('set_language') }}" class="language-flags"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{% if language_tournament %}<input type="hidden" name="tournament_id" value="{{ language_tournament.id }}">{% else %}<input type="hidden" name="next" value="{{ request.full_path }}">{% endif %}
{% for code,name in ui_languages.items() %}<button class="language-flag" type="submit" name="language" value="{{ code }}" title="{{ name }}" aria-label="{{ name }}" aria-pressed="{{ 'true' if ui_language == code else 'false' }}"><svg viewBox="0 0 30 20" width="30" height="20" aria-hidden="true">{% if code == 'pl' %}<path fill="#fff" d="M0 0h30v10H0z"/><path fill="#dc143c" d="M0 10h30v10H0z"/>{% elif code == 'en' %}<path fill="#012169" d="M0 0h30v20H0z"/><path stroke="#fff" stroke-width="5" d="M0 0l30 20M30 0L0 20"/><path stroke="#c8102e" stroke-width="2" d="M0 0l30 20M30 0L0 20"/><path stroke="#fff" stroke-width="7" d="M15 0v20M0 10h30"/><path stroke="#c8102e" stroke-width="4" d="M15 0v20M0 10h30"/>{% elif code == 'de' %}<path fill="#000" d="M0 0h30v7H0z"/><path fill="#d00" d="M0 7h30v7H0z"/><path fill="#ffce00" d="M0 14h30v6H0z"/>{% else %}<path fill="#002395" d="M0 0h10v20H0z"/><path fill="#fff" d="M10 0h10v20H10z"/><path fill="#ed2939" d="M20 0h10v20H20z"/>{% endif %}</svg></button>{% endfor %}
</form></nav>
<style>.language-bar{display:flex;justify-content:flex-end;max-width:1700px;margin:0 auto;padding:10px 26px 0;position:relative;z-index:40}.language-flags{display:flex;gap:6px;align-items:center}.language-flags .language-flag{display:grid;place-items:center;padding:5px;min-height:0;line-height:1;border:2px solid transparent;background:var(--panel);border-radius:6px}.language-flags .language-flag[aria-pressed=true]{border-color:var(--accent)}.language-flag svg{display:block;width:27px;height:18px;border-radius:2px}.language-flag:focus-visible{outline:3px solid var(--accent);outline-offset:2px}</style>
{% endif %}
